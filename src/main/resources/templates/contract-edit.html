<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập Nhật Hợp Đồng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-4 text-center text-warning">Cập Nhật Thông Tin Hợp Đồng</h3>
            
            <form th:action="@{/contracts/save}" th:object="${contract}" method="post">
                <!-- Bắt buộc phải có input hidden chứa id để phân biệt là cập nhật -->
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Chọn Phòng Trọ:</label>
                    <select th:field="*{room.id}" class="form-select" required>
                        <option value="">-- Chọn phòng --</option>
                        <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomNumber + ' (Giá: ' + r.price + ')'}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Chọn Khách Thuê:</label>
                    <select th:field="*{tenant.id}" class="form-select" required>
                        <option value="">-- Chọn khách thuê --</option>
                        <option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.fullName + ' - SĐT: ' + t.phone}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ngày bắt đầu:</label>
                    <input type="date" th:field="*{startDate}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ngày kết thúc:</label>
                    <input type="date" th:field="*{endDate}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tiền cọc (VNĐ):</label>
                    <input type="number" th:field="*{deposit}" class="form-control" required placeholder="Nhập tiền cọc">
                </div>
                <div class="mb-3">
                    <label class="form-label">Giá thuê hàng tháng (VNĐ):</label>
                    <input type="number" th:field="*{monthlyRent}" class="form-control" required placeholder="Nhập giá thuê thống nhất">
                </div>
                <div class="mb-3">
                    <label class="form-label">Trạng thái hợp đồng:</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="Đang hiệu lực">Đang hiệu lực</option>
                        <option value="Đã thanh lý">Đã thanh lý</option>
                    </select>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-warning px-4">Cập nhật</button>
                    <a th:href="@{/contracts}" class="btn btn-secondary px-4">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
