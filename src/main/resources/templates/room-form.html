<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Phòng Trọ Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-4 text-center text-success">Thêm Phòng Trọ Mới</h3>
            
            <!-- Cập nhật th:action trỏ về /admin/rooms/save -->
            <form th:action="@{/admin/rooms/save}" th:object="${room}" method="post">
                <div class="mb-3">
                    <label class="form-label">Số phòng:</label>
                    <input type="text" th:field="*{roomNumber}" class="form-control" required placeholder="Nhập số phòng (VD: P101)">
                </div>
                <div class="mb-3">
                    <label class="form-label">Giá thuê (VNĐ):</label>
                    <input type="number" th:field="*{price}" class="form-control" required placeholder="Nhập giá thuê">
                </div>
                <div class="mb-3">
                    <label class="form-label">Trạng thái:</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="TRONG">Còn trống</option>
                        <option value="DA_THUE">Đã thuê</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mô tả:</label>
                    <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Nhập mô tả phòng..."></textarea>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success px-4">Lưu lại</button>
                    <!-- Cập nhật nút quay lại trỏ về /admin/rooms -->
                    <a th:href="@{/admin/rooms}" class="btn btn-secondary px-4">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
