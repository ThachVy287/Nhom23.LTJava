<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Dịch Vụ Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h3 class="mb-4 text-center text-success">Thêm Dịch Vụ Mới</h3>
            
            <form th:action="@{/services/save}" th:object="${service}" method="post">
                <div class="mb-3">
                    <label class="form-label">Tên dịch vụ:</label>
                    <input type="text" th:field="*{serviceName}" class="form-control" required placeholder="VD: Tiền Điện, Nước, Internet...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Đơn giá (VNĐ):</label>
                    <input type="number" th:field="*{price}" class="form-control" required placeholder="Nhập đơn giá">
                </div>
                <div class="mb-3">
                    <label class="form-label">Đơn vị tính:</label>
                    <input type="text" th:field="*{unit}" class="form-control" required placeholder="VD: kWh, m3, tháng, phòng...">
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success px-4">Lưu dịch vụ</button>
                    <a th:href="@{/services}" class="btn btn-secondary px-4">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
