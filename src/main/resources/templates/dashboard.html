<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Quản Lý Phòng Trọ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse text-white min-vh-100 p-3">
            <h4 class="text-center py-3 text-warning border-bottom border-secondary">QUẢN LÝ TRỌ</h4>
            <ul class="nav flex-column mt-3">
                <li class="nav-item mb-2"><a th:href="@{/admin}" class="nav-link text-white active bg-primary rounded"><i class="bi bi-speedometer2 me-2"></i> Tổng quan</a></li>
                <li class="nav-item mb-2"><a th:href="@{/admin/rooms}" class="nav-link text-white"><i class="bi bi-door-open me-2"></i> Quản lý Phòng</a></li>
                <li class="nav-item mb-2"><a th:href="@{/tenants}" class="nav-link text-white"><i class="bi bi-people me-2"></i> Khách Thuê</a></li>
                <li class="nav-item mb-2"><a th:href="@{/contracts}" class="nav-link text-white"><i class="bi bi-file-earmark-text me-2"></i> Hợp Đồng</a></li>
                <li class="nav-item mb-2"><a th:href="@{/services}" class="nav-link text-white"><i class="bi bi-tools me-2"></i> Dịch Vụ</a></li>
                <li class="nav-item mb-2"><a th:href="@{/invoices}" class="nav-link text-white"><i class="bi bi-receipt me-2"></i> Hóa Đơn</a></li>
                <li class="nav-item mb-2"><a th:href="@{/reports}" class="nav-link text-white"><i class="bi bi-bar-chart-line me-2"></i> Báo Cáo Doanh Thu</a></li>
                
                <!-- Nút chuyển hướng nhanh về trang chủ công khai -->
                <li class="nav-item mb-2 mt-3 pt-3 border-top border-secondary">
                    <a th:href="@{/}" class="nav-link text-warning">
                        <i class="bi bi-house-door-fill me-2"></i> Xem trang chủ
                    </a>
                </li>

                <!-- NÚT ĐĂNG XUẤT MỚI THÊM -->
                <li class="nav-item mb-2">
                    <a th:href="@{/logout}" class="nav-link text-danger" onclick="return confirm('Bạn có chắc chắn muốn đăng xuất không?')">
                        <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2 text-primary fw-bold">Tổng quan hệ thống</h1>
            </div>

            <div class="row g-4">
                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm bg-primary text-white p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Tổng số phòng</h6>
                                <h2 class="fw-bold mb-0" th:text="${totalRooms}">0</h2>
                            </div>
                            <i class="bi bi-building fs-1 opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm bg-success text-white p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Phòng còn trống</h6>
                                <h2 class="fw-bold mb-0" th:text="${emptyRooms}">0</h2>
                            </div>
                            <i class="bi bi-door-open fs-1 opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm bg-warning text-dark p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Phòng đã thuê</h6>
                                <h2 class="fw-bold mb-0" th:text="${rentedRooms}">0</h2>
                            </div>
                            <i class="bi bi-key fs-1 opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="card border-0 shadow-sm bg-info text-white p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Tổng khách thuê</h6>
                                <h2 class="fw-bold mb-0" th:text="${totalTenants}">0</h2>
                            </div>
                            <i class="bi bi-people fs-1 opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
