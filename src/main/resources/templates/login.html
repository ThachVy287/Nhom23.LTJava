<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập Quản Trị Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm border-0 p-4" style="width: 400px;">
    <div class="card-body">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-primary display-4"></i>
            <h3 class="fw-bold text-dark mt-2">Đăng Nhập Chủ Trọ</h3>
            <p class="text-muted small">Khu vực quản lý hệ thống phòng trọ</p>
        </div>

        <!-- Hiển thị lỗi nếu sai tài khoản -->
        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên đăng nhập:</label>
                <input type="text" name="username" class="form-control" required placeholder="Nhập admin">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Mật khẩu:</label>
                <input type="password" name="password" class="form-control" required placeholder="Nhập 123456">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Đăng Nhập</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/}" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left"></i> Quay lại trang chủ</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
