<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Phòng Trọ Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 mb-5" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-4 text-center text-success">Thêm Phòng Trọ Mới</h3>
            
            <!-- Hiển thị thông báo lỗi nếu có -->
             <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- QUAN TRỌNG: Thêm enctype="multipart/form-data" để upload file -->
            <form th:action="@{/admin/rooms/save}" th:object="${room}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-bold">Số phòng:</label>
                    <input type="text" th:field="*{roomNumber}" class="form-control" required placeholder="Nhập số phòng (VD: P101)">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Giá thuê (VNĐ):</label>
                    <input type="number" th:field="*{price}" class="form-control" required placeholder="Nhập giá thuê">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Diện tích phòng (m²):</label>
                        <input type="number" step="any" th:field="*{roomArea}" class="form-control" placeholder="VD: 20">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Diện tích phòng tắm (m²):</label>
                        <input type="number" step="any" th:field="*{bathroomArea}" class="form-control" placeholder="VD: 3.5">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Vị trí tầng:</label>
                        <input type="number" th:field="*{floorNumber}" class="form-control" placeholder="VD: 1, 2, 3...">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Máy lạnh:</label>
                        <select th:field="*{hasAc}" class="form-select">
                            <option value="true">Có sẵn máy lạnh</option>
                            <option value="false">Không có</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Chọn hình ảnh phòng (Chọn ít nhất 4 hình):</label>
                    <input type="file" name="imageFiles" class="form-control" multiple accept="image/*" required>
                    <div class="form-text text-muted">Giữ phím Ctrl hoặc Shift để chọn đồng thời nhiều hình ảnh từ máy tính.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Trạng thái:</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="TRONG">Còn trống</option>
                        <option value="DA_THUE">Đã thuê</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Mô tả phòng:</label>
                    <textarea th:field="*{description}" class="form-control" rows="2" placeholder="Nhập mô tả không gian phòng..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Mô tả chi tiết phòng tắm:</label>
                    <textarea th:field="*{bathroomDesc}" class="form-control" rows="2" placeholder="VD: Phòng tắm khép kín, có bình nước nóng lạnh..."></textarea>
                </div>
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success px-4">Thêm mới</button>
                    <a th:href="@{/admin/rooms}" class="btn btn-secondary px-4">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
