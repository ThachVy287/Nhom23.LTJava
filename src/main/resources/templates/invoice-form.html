<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lập Hóa Đơn Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h3 class="mb-4 text-center text-success">Lập Hóa Đơn Tiền Phòng</h3>
            
            <form th:action="@{/invoices/save}" th:object="${invoice}" method="post">
                <div class="mb-3">
                    <label class="form-label">Chọn Phòng:</label>
                    <select th:field="*{room.id}" class="form-select" required>
                        <option value="">-- Chọn phòng trọ --</option>
                        <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomNumber + ' (Giá gốc: ' + r.price + ')'}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tháng / Năm (VD: 2026-10):</label>
                    <input type="text" th:field="*{monthYear}" class="form-control" required placeholder="YYYY-MM">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Số điện cũ:</label>
                        <input type="number" step="any" th:field="*{oldElectricity}" class="form-control" required placeholder="0">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Số điện mới:</label>
                        <input type="number" step="any" th:field="*{newElectricity}" class="form-control" required placeholder="0">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Đơn giá điện (VNĐ/kWh):</label>
                    <input type="number" th:field="*{electricityPrice}" class="form-control" required value="3500">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Số nước cũ:</label>
                        <input type="number" step="any" th:field="*{oldWater}" class="form-control" required placeholder="0">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Số nước mới:</label>
                        <input type="number" step="any" th:field="*{newWater}" class="form-control" required placeholder="0">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Đơn giá nước (VNĐ/m3):</label>
                    <input type="number" th:field="*{waterPrice}" class="form-control" required value="20000">
                </div>
                <div class="mb-3">
                    <label class="form-label">Trạng thái thanh toán:</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="CHUA_THANH_TOAN">Chưa thanh toán</option>
                        <option value="DA_THANH_TOAN">Đã thanh toán</option>
                    </select>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success px-4">Tính tiền & Lưu</button>
                    <a th:href="@{/invoices}" class="btn btn-secondary px-4">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
