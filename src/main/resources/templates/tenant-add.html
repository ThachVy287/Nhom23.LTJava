<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Khách Thuê Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-4 text-center text-success">Thêm Khách Thuê Mới</h3>
            
            <form th:action="@{/tenants/save}" th:object="${tenant}" method="post">
                <div class="mb-3">
                    <label class="form-label">Họ và tên:</label>
                    <input type="text" th:field="*{fullName}" class="form-control" required placeholder="Nhập họ tên đầy đủ">
                </div>
                <div class="mb-3">
                    <label class="form-label">Số điện thoại:</label>
                    <input type="text" th:field="*{phone}" class="form-control" required placeholder="Nhập số điện thoại">
                </div>
                <div class="mb-3">
                    <label class="form-label">Căn cước công dân (CCCD):</label>
                    <input type="text" th:field="*{cccd}" class="form-control" required placeholder="Nhập số CCCD">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email:</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="Nhập địa chỉ email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Chọn phòng trọ:</label>
                    <select th:field="*{room.id}" class="form-select">
                        <option value="">-- Chọn phòng cho thuê --</option>
                        <option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.roomNumber + ' (Giá: ' + room.price + ')'}"></option>
                    </select>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success px-4">Thêm mới</button>
                    <a th:href="@{/tenants}" class="btn btn-secondary px-4">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
