<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Dịch Vụ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse text-white min-vh-100 p-3">
            <h4 class="text-center py-3 text-warning border-bottom border-secondary">QUẢN LÝ TRỌ</h4>
            <ul class="nav flex-column mt-3">
                <!-- Cập nhật trỏ về /admin -->
                <li class="nav-item mb-2"><a th:href="@{/admin}" class="nav-link text-white"><i class="bi bi-speedometer2 me-2"></i> Tổng quan</a></li>
                <!-- Cập nhật trỏ về /admin/rooms -->
                <li class="nav-item mb-2"><a th:href="@{/admin/rooms}" class="nav-link text-white"><i class="bi bi-door-open me-2"></i> Quản lý Phòng</a></li>
                <li class="nav-item mb-2"><a th:href="@{/tenants}" class="nav-link text-white"><i class="bi bi-people me-2"></i> Khách Thuê</a></li>
                <li class="nav-item mb-2"><a th:href="@{/contracts}" class="nav-link text-white"><i class="bi bi-file-earmark-text me-2"></i> Hợp Đồng</a></li>
                <li class="nav-item mb-2"><a th:href="@{/services}" class="nav-link text-white active bg-primary rounded"><i class="bi bi-tools me-2"></i> Dịch Vụ</a></li>
                <li class="nav-item mb-2"><a th:href="@{/invoices}" class="nav-link text-white"><i class="bi bi-receipt me-2"></i> Hóa Đơn</a></li>
                <li class="nav-item mb-2"><a th:href="@{/reports}" class="nav-link text-white"><i class="bi bi-bar-chart-line me-2"></i> Báo Cáo Doanh Thu</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2 text-primary fw-bold"><i class="bi bi-tools"></i> Quản Lý Dịch Vụ Phòng Trọ</h1>
                <a th:href="@{/services/add}" class="btn btn-success shadow-sm"><i class="bi bi-plus-circle me-1"></i> Thêm dịch vụ mới</a>
            </div>

            <!-- HIỂN THỊ THÔNG BÁO LỖI HOẶC THÀNH CÔNG -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <!-- KẾT THÚC KHUNG THÔNG BÁO -->

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Tên dịch vụ</th>
                                <th>Đơn giá (VNĐ)</th>
                                <th>Đơn vị tính</th>
                                <th class="text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${services}">
                                <td th:text="${s.id}">1</td>
                                <td class="fw-bold" th:text="${s.serviceName}">Tiền Điện</td>
                                <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(s.price, 0, 'COMMA', 0, 'POINT')}">3,500</td>
                                <td th:text="${s.unit}">kWh</td>
                                <td class="text-center">
                                    <!-- Nút Sửa -->
                                    <a th:href="@{/services/edit/{id}(id=${s.id})}" class="btn btn-outline-warning btn-sm me-1">
                                        <i class="bi bi-pencil-square"></i> Sửa
                                    </a>
                                    <!-- Nút Xóa -->
                                    <a th:href="@{/services/delete/{id}(id=${s.id})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa dịch vụ này?')">
                                        <i class="bi bi-trash"></i> Xóa
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(services)}">
                                <td colspan="5" class="text-center text-muted py-4">Chưa có dịch vụ nào được thêm!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS để nút đóng (x) của alert hoạt động -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
