<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập Nhật Thông Tin Phòng Trọ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 mb-5" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-4 text-center text-warning">Cập Nhật Thông Tin Phòng Trọ</h3>
            
            <!-- Hiển thị thông báo lỗi nếu có -->
             <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            
            <form th:action="@{/admin/rooms/save}" th:object="${room}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}" />
                <!-- Ô chứa chuỗi URL các ảnh hiện tại -->
                <input type="hidden" id="imageUrlsInput" th:field="*{imageUrls}" />

                <div class="mb-3">
                    <label class="form-label fw-bold">Số phòng:</label>
                    <input type="text" th:field="*{roomNumber}" class="form-control" required placeholder="Nhập số phòng (VD: P101)">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Giá thuê (VNĐ):</label>
                    <input type="number" th:field="*{price}" class="form-control" required placeholder="Nhập giá thuê">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Diện tích phòng (m²):</label>
                        <input type="number" step="any" th:field="*{roomArea}" class="form-control" placeholder="VD: 20">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Diện tích phòng tắm (m²):</label>
                        <input type="number" step="any" th:field="*{bathroomArea}" class="form-control" placeholder="VD: 3.5">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Vị trí tầng:</label>
                        <input type="number" th:field="*{floorNumber}" class="form-control" placeholder="VD: 1, 2, 3...">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Máy lạnh:</label>
                        <select th:field="*{hasAc}" class="form-select">
                            <option value="true">Có sẵn máy lạnh</option>
                            <option value="false">Không có</option>
                        </select>
                    </div>
                </div>

                <!-- KHU VỰC XEM VÀ XÓA ẢNH HIỆN TẠI -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Ảnh hiện tại (Bấm vào dấu X để xóa ảnh):</label>
                    <div class="row g-2" id="currentImagesContainer">
                        <div class="col-3 position-relative text-center" th:each="img, iterStat : ${room.imageUrls != null ? room.imageUrls.split(',') : {}}">
                            <div th:if="${!img.isEmpty()}" class="border rounded p-1 bg-white shadow-sm">
                                <img th:src="${img}" class="img-fluid rounded" style="height: 90px; width: 100%; object-fit: cover;">
                                <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-1 rounded-circle p-1 lh-1" 
                                        th:onclick="removeImage([[(${iterStat.index})]])" title="Xóa ảnh này">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- KHU VỰC CHỌN THÊM ẢNH MỚI -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Thêm ảnh mới từ thư mục máy tính:</label>
                    <input type="file" name="imageFiles" class="form-control" multiple accept="image/*">
                    <div class="form-text text-muted">Có thể chọn nhiều hình cùng lúc để bổ sung vào phòng.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Trạng thái:</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="TRONG">Còn trống</option>
                        <option value="DA_THUE">Đã thuê</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Mô tả phòng:</label>
                    <textarea th:field="*{description}" class="form-control" rows="2" placeholder="Nhập mô tả không gian phòng..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Mô tả chi tiết phòng tắm:</label>
                    <textarea th:field="*{bathroomDesc}" class="form-control" rows="2" placeholder="VD: Phòng tắm khép kín, có bình nước nóng lạnh..."></textarea>
                </div>
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-warning px-4">Cập nhật</button>
                    <a th:href="@{/admin/rooms}" class="btn btn-secondary px-4">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- SCRIPT XỬ LÝ XÓA ẢNH TRỰC TIẾP TRÊN GIAO DIỆN -->
<script>
    function removeImage(index) {
        let inputField = document.getElementById('imageUrlsInput');
        let urls = inputField.value ? inputField.value.split(',') : [];
        
        // Xóa ảnh tại vị trí index
        urls.splice(index, 1);
        
        // Cập nhật lại giá trị input hidden
        inputField.value = urls.join(',');
        
        // Load lại giao diện khu vực hiển thị ảnh
        event.target.closest('.col-3').remove();
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
